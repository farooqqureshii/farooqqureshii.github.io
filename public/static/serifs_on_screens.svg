<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <pattern id="subpixel" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="3.5" height="11" fill="rgba(239, 68, 68, 0.25)" rx="0.5"/>
      <rect x="4" y="0" width="3.5" height="11" fill="rgba(34, 197, 94, 0.25)" rx="0.5"/>
      <rect x="8" y="0" width="3.5" height="11" fill="rgba(59, 130, 246, 0.25)" rx="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid Background -->
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Left Side: Vector Spline Curves & Blueprint -->
  <g opacity="0.9">
    <!-- Construction Guidelines -->
    <line x1="80" y1="180" x2="1120" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="90" y="172" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="12">CAP HEIGHT (700 units)</text>
    
    <line x1="80" y1="280" x2="1120" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="90" y="272" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="12">X-HEIGHT (480 units)</text>
    
    <line x1="80" y1="520" x2="1120" y2="520" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
    <text x="90" y="512" fill="rgba(239,68,68,0.7)" font-family="monospace" font-size="12">BASELINE (0 units)</text>

    <!-- Center Divider Line -->
    <line x1="600" y1="100" x2="600" y2="575" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Giant Specimen 'R' Letter Anatomy -->
  <!-- Left Half: Pure Smooth Vector Bézier Outline with Control Points -->
  <g clip-path="url(#leftHalf)">
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="600" height="675"/>
    </clipPath>
    <path d="M 380 180 C 470 180 540 210 540 290 C 540 350 490 385 430 400 L 550 520 L 460 520 L 360 415 L 340 415 L 340 520 L 260 520 L 260 180 Z M 340 240 L 340 355 L 380 355 C 440 355 465 330 465 295 C 465 260 435 240 380 240 Z" 
          fill="url(#textGrad)" opacity="0.95"/>
    <!-- Serif Brackets Detail on Left Foot -->
    <path d="M 230 520 L 370 520 L 370 508 C 350 508 340 500 340 480 L 340 220 C 340 200 350 192 370 192 L 370 180 L 230 180 L 230 192 C 250 192 260 200 260 220 L 260 480 C 260 500 250 508 230 508 Z" 
          fill="#ffffff" opacity="0.9"/>
    <!-- Tangent lines and control points -->
    <circle cx="470" cy="180" r="4" fill="#3b82f6"/>
    <circle cx="540" cy="210" r="4" fill="#3b82f6"/>
    <line x1="380" y1="180" x2="470" y2="180" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="140" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="14" font-weight="600">CONTINUOUS BÉZIER SPLINES</text>
    <text x="240" y="160" fill="#71717a" font-family="monospace" font-size="12">Infinite resolution / Print 2400 DPI</text>
  </g>

  <!-- Right Half: Coarse Pixel Discretization & Subpixel Phosphor Grid -->
  <g clip-path="url(#rightHalf)">
    <clipPath id="rightHalf">
      <rect x="600" y="0" width="600" height="675"/>
    </clipPath>
    
    <!-- Pixelated Blocks of 'R' -->
    <g opacity="0.9">
      <g fill="#ffffff">
        <rect x="600" y="180" width="80" height="20" opacity="0.95"/>
        <rect x="680" y="180" width="40" height="20" opacity="0.6"/>
        <rect x="600" y="200" width="100" height="20" opacity="1"/>
        <rect x="700" y="200" width="40" height="20" opacity="0.8"/>
        <rect x="600" y="220" width="40" height="20" opacity="1"/>
        <rect x="720" y="220" width="40" height="20" opacity="0.9"/>
        <rect x="600" y="240" width="40" height="20" opacity="1"/>
        <rect x="740" y="240" width="40" height="20" opacity="0.95"/>
        <rect x="600" y="260" width="40" height="20" opacity="1"/>
        <rect x="740" y="260" width="40" height="20" opacity="0.95"/>
        <rect x="600" y="280" width="40" height="20" opacity="1"/>
        <rect x="720" y="280" width="40" height="20" opacity="0.85"/>
        <rect x="600" y="300" width="60" height="20" opacity="1"/>
        <rect x="660" y="300" width="60" height="20" opacity="0.8"/>
        <rect x="600" y="320" width="100" height="20" opacity="1"/>
        <rect x="700" y="320" width="40" height="20" opacity="0.7"/>
        <rect x="600" y="340" width="80" height="20" opacity="0.9"/>
        <!-- Diagonal Leg Pixels -->
        <rect x="640" y="360" width="40" height="20" opacity="0.6"/>
        <rect x="660" y="380" width="40" height="20" opacity="0.8"/>
        <rect x="680" y="400" width="40" height="20" opacity="0.9"/>
        <rect x="700" y="420" width="40" height="20" opacity="0.95"/>
        <rect x="720" y="440" width="40" height="20" opacity="0.95"/>
        <rect x="740" y="460" width="40" height="20" opacity="1"/>
        <rect x="760" y="480" width="60" height="20" opacity="1"/>
        <rect x="740" y="500" width="100" height="20" opacity="1"/>
        <!-- Quantization error / anti-aliasing artifacts -->
        <rect x="840" y="500" width="20" height="20" fill="rgba(239, 68, 68, 0.5)"/>
        <rect x="780" y="460" width="20" height="20" fill="rgba(59, 130, 246, 0.4)"/>
        <rect x="780" y="240" width="20" height="20" fill="rgba(239, 68, 68, 0.4)"/>
        <rect x="760" y="280" width="20" height="20" fill="rgba(34, 197, 94, 0.4)"/>
      </g>
    </g>

    <!-- Subpixel Phosphor Overlay -->
    <rect x="600" y="160" width="340" height="380" fill="url(#subpixel)" opacity="0.45"/>

    <text x="640" y="140" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="14" font-weight="600">DISCRETE SCREEN RASTER (96 DPI)</text>
    <text x="640" y="160" fill="#71717a" font-family="monospace" font-size="12">Stem dropouts &amp; Subpixel ClearType RGB</text>
  </g>

  <!-- Floating Badges -->
  <g transform="translate(60, 585)">
    <rect width="430" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="21" cy="21" r="6" fill="#10b981"/>
    <text x="38" y="26" fill="#f4f4f5" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      Interactive Typography Lab &amp; Investigation
    </text>
  </g>
  
  <g transform="translate(860, 585)">
    <rect width="280" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="24" y="26" fill="#a1a1aa" font-family="monospace" font-size="13">
      Bézier ↔ Raster ↔ Subpixel
    </text>
  </g>
</svg>
